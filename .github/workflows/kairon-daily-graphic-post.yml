name: Kairon Daily Graphic Post

on:
  push:
    paths:
      - '.github/workflows/kairon-daily-graphic-post.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Instagram now'
        required: false
        default: 'false'
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: kairon-daily-graphic-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run may publish
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          SHOULD=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            HOUR=$(TZ=Europe/Rome date +%H)
            if [ "$HOUR" = "19" ]; then
              SHOULD=true
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            SHOULD=true
          fi
          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Rome time: $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "SHOULD_PUBLISH=$SHOULD"

      - name: Prepare next approved graphic post
        if: steps.gate.outputs.should_publish == 'true'
        id: post
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(tr -d '\r\n ' < state/next_reel.txt)
          test -n "$DAY"
          if [ "$DAY" -lt 2 ] || [ "$DAY" -gt 30 ]; then
            echo "Invalid next post day: $DAY"
            exit 1
          fi

          ITEM=$(jq -c --argjson day "$DAY" '.[] | select(.day == $day)' scheduled_posts/manifest.json)
          test -n "$ITEM"
          FILE=$(echo "$ITEM" | jq -r '.file')
          TITLE=$(echo "$ITEM" | jq -r '.title')
          CAPTION=$(echo "$ITEM" | jq -r '.caption')
          test -f "scheduled_posts/$FILE"

          SHA=$(git rev-parse HEAD)
          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/scheduled_posts/${FILE}"

          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          {
            echo 'caption<<EOF'
            echo "$CAPTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          for i in {1..20}; do
            HTTP=$(curl -L -sS -o /tmp/post.jpg -w '%{http_code}' "$IMAGE_URL" || true)
            if [ "$HTTP" = "200" ] && [ -s /tmp/post.jpg ]; then
              file /tmp/post.jpg
              exit 0
            fi
            sleep 3
          done
          echo "Graphic image URL did not become available"
          exit 1

      - name: Publish graphic post to Instagram
        if: steps.gate.outputs.should_publish == 'true'
        id: instagram
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.post.outputs.image_url }}
          CAPTION: ${{ steps.post.outputs.caption }}
        run: |
          set -euo pipefail

          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION")
          echo "CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          MID=''
          for attempt in 1 2 3 4 5; do
            PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" \
              -H "Authorization: Bearer $TOKEN" \
              --data-urlencode "creation_id=$CID")
            echo "PUBLISH_ATTEMPT_${attempt}=$PUB"
            MID=$(echo "$PUB" | jq -r '.id // empty')
            [ -n "$MID" ] && break
            sleep $((attempt * 8))
          done
          test -n "$MID"

          OK=0
          for i in {1..25}; do
            RECENT=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://graph.instagram.com/$IG/media?fields=id,media_type,permalink,timestamp,caption&limit=10")
            FOUND=$(echo "$RECENT" | jq -r --arg MID "$MID" '[.data[]?.id == $MID] | any')
            if [ "$FOUND" = 'true' ]; then
              LINK=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .permalink')
              TYPE=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .media_type')
              test "$TYPE" = 'IMAGE'
              test -n "$LINK"
              echo "Instagram post visible: $LINK"
              OK=1
              break
            fi
            sleep 6
          done
          [ "$OK" = 1 ]

      - name: Advance queue only after successful publication
        if: steps.gate.outputs.should_publish == 'true' && success()
        shell: bash
        env:
          DAY: ${{ steps.post.outputs.day }}
          TITLE: ${{ steps.post.outputs.title }}
        run: |
          set -euo pipefail
          NEXT=$((DAY + 1))
          if [ "$NEXT" -gt 30 ]; then
            NEXT=2
          fi
          printf '%s\n' "$NEXT" > state/next_reel.txt

          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add state/next_reel.txt
          git commit -m "Advance Kairon graphic post queue after ${TITLE}" || exit 0
          git push
