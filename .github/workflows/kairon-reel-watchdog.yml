name: Kairon Reel 19:10 Watchdog

on:
  schedule:
    - cron: '10,20,30,40,50 17 * * *'
    - cron: '10,20,30,40,50 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kairon-reel-watchdog.yml'

permissions:
  actions: write
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Reel fallback in Europe Rome evening
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Kairon reel watchdog manual publish 2026-08-30'
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] || [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            SHOULD=true
          else
            HOUR=$(TZ=Europe/Rome date +%H)
            SHOULD=false
            case "$HOUR" in 19|20) SHOULD=true ;; esac
          fi
          echo "fallback_should_run=$SHOULD"
          if [ "$SHOULD" != 'true' ]; then exit 0; fi
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$REPO/actions/workflows/kairon-daily-premium-reel.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}')
          echo "reel fallback dispatch HTTP=$code"
          test "$code" = '204'
