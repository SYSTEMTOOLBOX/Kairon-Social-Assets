name: Kairon Emergency Reel Now

on:
  push:
    paths:
      - '.github/workflows/reel-emergency-now.yml'

permissions:
  contents: write

jobs:
  publish-now:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build lightweight pizzeria Reel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          ffmpeg -y -loop 1 -framerate 30 -i today/kairon-pizzeria.jpg \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -filter_complex "[0:v]scale=1000:1760:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black,fade=t=in:st=0:d=0.3,fade=t=out:st=8.6:d=0.4,format=yuv420p[v]" \
            -map "[v]" -map 1:a -t 9 -r 30 \
            -c:v libx264 -preset ultrafast -crf 22 \
            -c:a aac -b:a 96k -movflags +faststart \
            generated/emergency-pizzeria.mp4

      - name: Commit video
        id: video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"
          git add generated/emergency-pizzeria.mp4
          git commit -m "Prepare emergency pizzeria Reel" || true
          git push
          SHA=$(git rev-parse HEAD)
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/emergency-pizzeria.mp4" >> "$GITHUB_OUTPUT"

      - name: Wait for raw video
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.video.outputs.url }}"
          for i in {1..24}; do
            if curl -fL --silent --output /dev/null "$URL"; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Publish Instagram Reel now
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: |
          set -euo pipefail
          PROFILE=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" "https://graph.instagram.com/me?fields=id,username")
          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          test -n "$IG_USER_ID"
          CAPTION="La tua pizzeria merita un sito che faccia venire fame al primo sguardo. Realizziamo siti web su misura per ristoranti e attivita locali. Vuoi vedere una demo gratuita? Scrivici in DM. #KaironLabsStudio #Pizzeria #SitiWeb #WebDesign"
          CREATE=$(curl --fail-with-body --silent --show-error -X POST "https://graph.instagram.com/$IG_USER_ID/media" -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" --data-urlencode "media_type=REELS" --data-urlencode "video_url=$VIDEO_URL" --data-urlencode "caption=$CAPTION" --data-urlencode "share_to_feed=true")
          CREATION_ID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CREATION_ID"
          READY=false
          for i in {1..30}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" "https://graph.instagram.com/$CREATION_ID?fields=status_code")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status_code // empty')
            echo "Instagram status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then READY=true; break; fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then echo "$STATUS_JSON"; exit 1; fi
            sleep 10
          done
          test "$READY" = "true"
          PUBLISH=$(curl --fail-with-body --silent --show-error -X POST "https://graph.instagram.com/$IG_USER_ID/media_publish" -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" --data-urlencode "creation_id=$CREATION_ID")
          MEDIA_ID=$(echo "$PUBLISH" | jq -r '.id // empty')
          test -n "$MEDIA_ID"
          echo "PUBLISHED MEDIA ID: $MEDIA_ID"
