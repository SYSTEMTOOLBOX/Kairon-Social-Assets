name: Kairon Native 4x5 Post Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairon-native-4x5-post-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify native 4x5 test asset
        shell: bash
        run: |
          set -euo pipefail
          FILE='approved/kairon-test-post-1080x1350.jpg'
          test -s "$FILE"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$FILE")
          echo "Native asset dimensions: $DIM"
          test "$DIM" = '1080x1350'

      - name: Prepare direct native image URL
        id: image
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/approved/kairon-test-post-1080x1350.jpg"
          HTTP=$(curl -L --fail --retry 3 --retry-delay 2 -sS -o /tmp/native-post.jpg -w '%{http_code}' "$URL")
          echo "Raw image HTTP=$HTTP"
          test "$HTTP" = '200'
          test -s /tmp/native-post.jpg
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/native-post.jpg)
          echo "Downloaded native dimensions: $DIM"
          test "$DIM" = '1080x1350'
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish native 4x5 test to Instagram
        id: publish
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.image.outputs.url }}
          CAPTION: 'TEST TECNICO Kairon — Post nativo 4:5 1080×1350. Verifica formato senza ridimensionamento.'
        run: |
          set -euo pipefail

          HTTP_ME=$(curl -sS -o /tmp/instagram-me.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            'https://graph.instagram.com/me?fields=id,username')
          ME=$(cat /tmp/instagram-me.json)
          echo "Instagram account check HTTP=$HTTP_ME"
          if [ "$HTTP_ME" -lt 200 ] || [ "$HTTP_ME" -ge 300 ]; then
            ERROR_MSG=$(echo "$ME" | jq -r '.error.message // .message // "unknown error"')
            echo "Instagram account error: $ERROR_MSG"
            exit 1
          fi

          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          echo "Instagram username=$USERNAME"
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          HTTP_CREATE=$(curl -sS -o /tmp/instagram-create.json -w '%{http_code}' -X POST \
            "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION")
          CREATE=$(cat /tmp/instagram-create.json)
          echo "Instagram media create HTTP=$HTTP_CREATE"
          if [ "$HTTP_CREATE" -lt 200 ] || [ "$HTTP_CREATE" -ge 300 ]; then
            ERROR_MSG=$(echo "$CREATE" | jq -r '.error.message // .message // "unknown error"')
            echo "Instagram media create error: $ERROR_MSG"
            exit 1
          fi

          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          READY=false
          for i in {1..20}; do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "Instagram container status $i: $CODE"
            if [ "$CODE" = 'FINISHED' ]; then READY=true; break; fi
            if [ "$CODE" = 'ERROR' ] || [ "$CODE" = 'EXPIRED' ]; then
              echo "$STATUS"
              exit 1
            fi
            sleep 3
          done
          test "$READY" = true

          HTTP_PUB=$(curl -sS -o /tmp/instagram-publish.json -w '%{http_code}' -X POST \
            "https://graph.instagram.com/$IG/media_publish" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "creation_id=$CID")
          PUB=$(cat /tmp/instagram-publish.json)
          echo "Instagram media publish HTTP=$HTTP_PUB"
          if [ "$HTTP_PUB" -lt 200 ] || [ "$HTTP_PUB" -ge 300 ]; then
            ERROR_MSG=$(echo "$PUB" | jq -r '.error.message // .message // "unknown error"')
            echo "Instagram media publish error: $ERROR_MSG"
            exit 1
          fi

          MID=$(echo "$PUB" | jq -r '.id // empty')
          test -n "$MID"
          echo "Instagram published media id=$MID"
