name: Kairon Daily Premium Post

on:
  push:
    paths:
      - 'state/trigger-premium-post-test.txt'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish premium post now'
        required: false
        default: 'false'
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'

permissions:
  contents: write

concurrency:
  group: kairon-daily-premium-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify premium assets
        shell: bash
        run: |
          set -euo pipefail
          test -f approved/gioielleria-post.jpg
          test -f approved/parrucchiere-post.jpg
          test -f today/kairon-pizzeria.jpg
          test -f state/premium_post_index.txt

      - name: Gate at 18 Europe/Rome
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          SHOULD=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            HOUR=$(TZ=Europe/Rome date +%H)
            [ "$HOUR" = "18" ] && SHOULD=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            SHOULD=true
          elif [ "$EVENT_NAME" = "push" ]; then
            SHOULD=true
          fi
          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Rome time: $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Skip if a premium post was already published today
        id: daily
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Rome date +%F)
          LAST=''
          [ -f state/premium_post_last_date.txt ] && LAST=$(tr -d '\r\n ' < state/premium_post_last_date.txt)
          if [ "$TODAY" = "$LAST" ]; then
            echo 'already_posted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_posted=false' >> "$GITHUB_OUTPUT"
          fi
          echo "TODAY=$TODAY LAST=$LAST"

      - name: Choose next approved premium post
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          IDX=$(tr -d '\r\n ' < state/premium_post_index.txt)
          case "$IDX" in
            0) FILE='approved/gioielleria-post.jpg'; TITLE='GIOIELLERIA'; CAPTION='Sito web per gioielleria ✨ Eleganza, prestigio e presenza digitale su misura. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Gioielleria #SitoWeb #WebDesign' ;;
            1) FILE='approved/parrucchiere-post.jpg'; TITLE='PARRUCCHIERE'; CAPTION='Sito web per parrucchiere ✂️ Immagine premium, prenotazioni e contatto diretto. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Parrucchiere #SitoWeb #WebDesign' ;;
            2) FILE='today/kairon-pizzeria.jpg'; TITLE='PIZZERIA'; CAPTION='Sito web per pizzeria 🍕 Menu, prenotazioni e contatti con una presenza digitale che fa venire fame. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Pizzeria #SitoWeb #WebDesign' ;;
            *) echo "Invalid premium post index: $IDX"; exit 1 ;;
          esac
          test -f "$FILE"
          echo "index=$IDX" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          {
            echo 'caption<<EOF'
            echo "$CAPTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ensure ffmpeg is installed
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Prepare Instagram 4x5 premium post
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        id: image
        shell: bash
        env:
          SOURCE: ${{ steps.pick.outputs.file }}
          TITLE: ${{ steps.pick.outputs.title }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p generated
          OUT="generated/premium-post-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jpg"

          ffmpeg -y -i "$SOURCE" \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1080:1350:force_original_aspect_ratio=increase,crop=1080:1350,gblur=sigma=28,eq=brightness=-0.32[bg2];[fg]scale=-2:1350:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2[out]" \
            -map '[out]' -frames:v 1 -q:v 2 "$OUT"

          test -s "$OUT"
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$OUT")
          echo "Rendered dimensions: $DIM"
          test "$DIM" = '1080x1350'

          base64 -w 0 "$OUT" > /tmp/post-image.b64
          jq -n \
            --arg message "Upload 4x5 premium Kairon post ${TITLE} run ${GITHUB_RUN_ID}" \
            --rawfile content /tmp/post-image.b64 \
            --arg branch "main" \
            '{message:$message,content:$content,branch:$branch}' > /tmp/upload.json

          UPLOAD=$(curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/upload.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${OUT}")

          COMMIT_SHA=$(echo "$UPLOAD" | jq -r '.commit.sha // empty')
          if [ -z "$COMMIT_SHA" ]; then
            echo "GitHub upload failed: $(echo "$UPLOAD" | jq -c '{message,status,documentation_url}')"
            exit 1
          fi
          echo "Uploaded 4x5 image in commit $COMMIT_SHA"

          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${COMMIT_SHA}/${OUT}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

          READY=false
          for i in {1..25}; do
            HTTP=$(curl -L -sS -o /tmp/check.jpg -w '%{http_code}' "$URL" || true)
            if [ "$HTTP" = "200" ] && [ -s /tmp/check.jpg ]; then
              READY=true
              break
            fi
            sleep 3
          done
          [ "$READY" = true ]

      - name: Publish premium post to Instagram
        id: publish
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.image.outputs.url }}
          CAPTION: ${{ steps.pick.outputs.caption }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION")
          echo "CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          READY=false
          for i in {1..20}; do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "STATUS_$i=$STATUS"
            if [ "$CODE" = 'FINISHED' ]; then READY=true; break; fi
            if [ "$CODE" = 'ERROR' ] || [ "$CODE" = 'EXPIRED' ]; then exit 1; fi
            sleep 3
          done
          [ "$READY" = true ]

          PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "creation_id=$CID")
          echo "PUBLISH=$PUB"
          MID=$(echo "$PUB" | jq -r '.id // empty')
          test -n "$MID"
          echo "media_id=$MID" >> "$GITHUB_OUTPUT"

      - name: Advance premium post queue after success
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true' && success()
        shell: bash
        env:
          IDX: ${{ steps.pick.outputs.index }}
          TITLE: ${{ steps.pick.outputs.title }}
          MEDIA_ID: ${{ steps.publish.outputs.media_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEXT=$(( (IDX + 1) % 3 ))
          TODAY=$(TZ=Europe/Rome date +%F)

          update_state_file() {
            PATH_NAME="$1"
            VALUE="$2"
            MESSAGE="$3"

            META=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}?ref=main")
            OLD_SHA=$(echo "$META" | jq -r '.sha // empty')
            ENCODED=$(printf '%s\n' "$VALUE" | base64 -w 0)

            if [ -n "$OLD_SHA" ]; then
              jq -n --arg message "$MESSAGE" --arg content "$ENCODED" --arg sha "$OLD_SHA" --arg branch main \
                '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/state.json
            else
              jq -n --arg message "$MESSAGE" --arg content "$ENCODED" --arg branch main \
                '{message:$message,content:$content,branch:$branch}' > /tmp/state.json
            fi

            RESP=$(curl -sS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/state.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${PATH_NAME}")
            NEW_SHA=$(echo "$RESP" | jq -r '.commit.sha // empty')
            test -n "$NEW_SHA"
            echo "Updated ${PATH_NAME} in ${NEW_SHA}"
          }

          # Write last_date first: even if a later receipt update fails, a successful Instagram publish cannot duplicate today.
          update_state_file state/premium_post_last_date.txt "$TODAY" "Mark premium Post published ${TODAY}"
          update_state_file state/premium_post_index.txt "$NEXT" "Advance premium Post queue after ${TITLE}"
          update_state_file state/premium_post_last_media_id.txt "$MEDIA_ID" "Save premium Post Instagram media receipt"
