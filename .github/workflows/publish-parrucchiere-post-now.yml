name: Publish Approved Parrucchiere Post

on:
  push:
    paths:
      - 'approved/parrucchiere_chunks/**'
      - '.github/workflows/publish-parrucchiere-post-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-approved-parrucchiere-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact approved image and publish it
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat approved/parrucchiere_chunks/chunk*.txt | tr -d '\n\r ' | base64 -d > /tmp/parrucchiere-post.jpg
          SIZE=$(wc -c </tmp/parrucchiere-post.jpg)
          SHA=$(sha256sum /tmp/parrucchiere-post.jpg | awk '{print $1}')
          echo "Rebuilt JPG bytes=$SIZE sha256=$SHA"
          test "$SIZE" -eq 26957
          test "$SHA" = "eff6fea6ac8375536976370e76d6cdca3014bc410a87df7155bd3a64628fbb75"
          file /tmp/parrucchiere-post.jpg

          B64=$(base64 -w0 /tmp/parrucchiere-post.jpg)
          OLD=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/approved/parrucchiere-post.jpg?ref=main")
          OLD_SHA=$(echo "$OLD" | jq -r '.sha // empty')
          jq -n --arg message "Rebuild full approved parrucchiere post" --arg content "$B64" --arg branch "main" --arg sha "$OLD_SHA" \
            '{message:$message,content:$content,branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)' > /tmp/payload.json

          curl --fail-with-body -sS \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/approved/parrucchiere-post.jpg" \
            --data-binary @/tmp/payload.json > /tmp/github-upload.json
          echo "GitHub image commit: $(jq -r '.commit.sha' /tmp/github-upload.json)"

          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/approved/parrucchiere-post.jpg"
          for i in {1..24}; do
            HTTP=$(curl -L -sS -o /tmp/check.jpg -w '%{http_code}' "$IMAGE_URL" || true)
            REMOTE_SIZE=$(wc -c </tmp/check.jpg 2>/dev/null || echo 0)
            REMOTE_SHA=$(sha256sum /tmp/check.jpg 2>/dev/null | awk '{print $1}' || true)
            echo "Raw check $i: HTTP=$HTTP bytes=$REMOTE_SIZE sha256=$REMOTE_SHA"
            if [ "$HTTP" = "200" ] && [ "$REMOTE_SIZE" -eq 26957 ] && [ "$REMOTE_SHA" = "eff6fea6ac8375536976370e76d6cdca3014bc410a87df7155bd3a64628fbb75" ]; then
              break
            fi
            sleep 5
          done
          test "$(wc -c </tmp/check.jpg)" -eq 26957
          test "$(sha256sum /tmp/check.jpg | awk '{print $1}')" = "eff6fea6ac8375536976370e76d6cdca3014bc410a87df7155bd3a64628fbb75"

          PROFILE=$(curl -sS \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            "https://graph.instagram.com/me?fields=id,username")
          echo "Instagram profile response: $PROFILE"
          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          USERNAME=$(echo "$PROFILE" | jq -r '.username // empty')
          test -n "$IG_USER_ID"
          echo "Publishing approved static post for @$USERNAME"

          CAPTION='Sito web per parrucchiere ✂️\n\nUn’immagine professionale online, prenotazioni più semplici e un sito pensato per valorizzare il tuo salone.\n\nRichiedi una demo a Kairon Labs Studio.\n\n#KaironLabsStudio #SitoWeb #Parrucchiere #WebDesign #SitiWeb'

          CREATION_ID=""
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
              -X POST "https://graph.instagram.com/$IG_USER_ID/media" \
              -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
              --data-urlencode "image_url=$IMAGE_URL" \
              --data-urlencode "caption=$CAPTION" || true)
            BODY=$(cat /tmp/create.json)
            echo "Create attempt $attempt: HTTP=$CODE response=$BODY"
            CREATION_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            [ -n "$CREATION_ID" ] && break
            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done
          test -n "$CREATION_ID"
          echo "Instagram creation id: $CREATION_ID"

          MEDIA_ID=""
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/publish.json -w '%{http_code}' \
              -X POST "https://graph.instagram.com/$IG_USER_ID/media_publish" \
              -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
              --data-urlencode "creation_id=$CREATION_ID" || true)
            BODY=$(cat /tmp/publish.json)
            echo "Publish attempt $attempt: HTTP=$CODE response=$BODY"
            MEDIA_ID=$(echo "$BODY" | jq -r '.id // empty' 2>/dev/null || true)
            [ -n "$MEDIA_ID" ] && break
            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done
          test -n "$MEDIA_ID"
          echo "KAIRON STATIC POST PUBLISHED: $MEDIA_ID"
