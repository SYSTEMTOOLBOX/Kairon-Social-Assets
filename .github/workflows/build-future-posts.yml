name: Build Future Kairon Posts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_future_posts.py'
      - '.github/workflows/build-future-posts.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter fonts-font-awesome
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Generate 29 future posts
        run: |
          rm -rf scheduled_posts
          python scripts/build_future_posts.py
          test "$(find scheduled_posts -maxdepth 1 -name '*.jpg' | wc -l)" -eq 29
          test -f scheduled_posts/manifest.json

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduled_posts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Generate 29 future Kairon posts in parrucchiere style"
          git push
