name: Publish Gioielleria Post Now

on:
  push:
    paths:
      - '.github/workflows/publish-gioielleria-post-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build real Gioielleria post
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core; }
          mkdir -p generated
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=#080808:s=1080x1350:d=1 \
            -vf "drawbox=x=0:y=0:w=1080:h=1350:color=#080808:t=fill,drawbox=x=70:y=70:w=940:h=1210:color=#d4af37@0.35:t=3,drawbox=x=140:y=260:w=800:h=2:color=#d4af37@0.75:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='KAIRON LABS STUDIO':fontcolor=#d4af37:fontsize=58:x=(w-text_w)/2:y=120,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SITO WEB PER':fontcolor=white:fontsize=76:x=(w-text_w)/2:y=330,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GIOIELLERIA':fontcolor=#d4af37:fontsize=92:x=(w-text_w)/2:y=420,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Eleganza online che valorizza ogni dettaglio':fontcolor=white:fontsize=36:x=(w-text_w)/2:y=570,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Catalogo digitale  |  WhatsApp  |  Contatti rapidi':fontcolor=#e7d8a1:fontsize=32:x=(w-text_w)/2:y=655,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Mostra collezioni, servizi e promozioni':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=760,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='con un sito premium pensato per il tuo brand.':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=810,drawbox=x=300:y=960:w=480:h=110:color=#d4af37:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='RICHIEDI UNA DEMO':fontcolor=black:fontsize=42:x=(w-text_w)/2:y=990,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='kaironlabsstudio':fontcolor=#d4af37:fontsize=30:x=(w-text_w)/2:y=1150" \
            -frames:v 1 generated/kairon-gioielleria-post.jpg
          test -s generated/kairon-gioielleria-post.jpg

      - name: Publish image file to GitHub
        id: image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add generated/kairon-gioielleria-post.jpg
          git commit -m 'Real Gioielleria Instagram post asset' || true
          git push
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/kairon-gioielleria-post.jpg"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in {1..20}; do
            HTTP=$(curl -L -sS -o /dev/null -w '%{http_code}' "$URL" || true)
            [ "$HTTP" = "200" ] && exit 0
            sleep 3
          done
          exit 1

      - name: Publish real Gioielleria post to Instagram and verify
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.image.outputs.url }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          CAPTION=$'Sito web per gioielleria ✨\n\nUn’immagine online elegante, catalogo digitale, contatti rapidi e una vetrina pensata per valorizzare il tuo brand.\n\nRichiedi una demo a Kairon Labs Studio.\n\n#KaironLabsStudio #Gioielleria #SitoWeb #WebDesign #SitiWeb'

          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION")
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          MID=''
          for attempt in 1 2 3 4 5; do
            PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" \
              -H "Authorization: Bearer $TOKEN" \
              --data-urlencode "creation_id=$CID")
            MID=$(echo "$PUB" | jq -r '.id // empty')
            [ -n "$MID" ] && break
            sleep $((attempt * 8))
          done
          test -n "$MID"

          OK=0
          for i in {1..20}; do
            RECENT=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://graph.instagram.com/$IG/media?fields=id,media_type,media_product_type,permalink,timestamp,caption&limit=10")
            FOUND=$(echo "$RECENT" | jq -r --arg MID "$MID" '[.data[]?.id == $MID] | any')
            if [ "$FOUND" = 'true' ]; then
              LINK=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .permalink')
              echo "VISIBLE_POST_ID=$MID"
              echo "VISIBLE_POST_PERMALINK=$LINK"
              OK=1
              break
            fi
            sleep 6
          done
          [ "$OK" = 1 ]
