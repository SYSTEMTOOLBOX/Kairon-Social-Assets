name: Kairon Post 18:10 Watchdog

on:
  schedule:
    - cron: '10 16 * * *'
    - cron: '10 17 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Post fallback for the correct Rome schedule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          SHOULD=false

          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            SHOULD=true
          else
            OFFSET=$(TZ=Europe/Rome date +%z)
            echo "Europe/Rome UTC offset: $OFFSET"
            echo "Scheduled cron: $SCHEDULE"

            if [ "$OFFSET" = '+0200' ] && [ "$SCHEDULE" = '10 16 * * *' ]; then
              SHOULD=true
            elif [ "$OFFSET" = '+0100' ] && [ "$SCHEDULE" = '10 17 * * *' ]; then
              SHOULD=true
            fi
          fi

          echo "post_fallback_should_run=$SHOULD"
          if [ "$SHOULD" != 'true' ]; then exit 0; fi

          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$REPO/actions/workflows/kairon-daily-premium-post.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}')
          echo "post fallback dispatch HTTP=$code"
          test "$code" = '204'
