name: Kairon Post 18 Watchdog

on:
  schedule:
    - cron: '10,20,30,40,50 16 * * *'
    - cron: '10,20,30,40,50 17 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kairon-post-watchdog.yml'

permissions:
  actions: write
  contents: read

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Post fallback in Europe Rome 18 hour
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Kairon post watchdog manual publish 2026-08-30'
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] || [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            SHOULD=true
          else
            HOUR=$(TZ=Europe/Rome date +%H)
            SHOULD=false
            if [ "$HOUR" = '18' ]; then SHOULD=true; fi
          fi
          echo "post_fallback_should_run=$SHOULD"
          if [ "$SHOULD" != 'true' ]; then exit 0; fi
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$REPO/actions/workflows/kairon-daily-premium-post.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}')
          echo "post fallback dispatch HTTP=$code"
          test "$code" = '204'
