name: Kairon Pizza Reel Now

on:
  push:
    paths:
      - '.github/workflows/pizza-now.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Build pizzeria Reel from embedded verified image
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pizza.b64 <<'B64'

B64
          base64 -d /tmp/pizza.b64 > /tmp/pizza.jpg
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 /tmp/pizza.jpg
          mkdir -p generated
          ffmpeg -y -loop 1 -framerate 30 -i /tmp/pizza.jpg \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fade=t=in:st=0:d=0.2,fade=t=out:st=5.7:d=0.3,format=yuv420p" \
            -map 0:v -map 1:a -t 6 -r 30 \
            -c:v libx264 -preset ultrafast -crf 32 \
            -c:a aac -b:a 48k -movflags +faststart \
            generated/pizzeria-now.mp4

      - name: Commit ready Reel
        id: video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"
          git add generated/pizzeria-now.mp4
          git commit -m "Prepare pizzeria Reel now"
          git push
          SHA=$(git rev-parse HEAD)
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/pizzeria-now.mp4" >> "$GITHUB_OUTPUT"

      - name: Wait for raw video
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.video.outputs.url }}"
          for i in {1..24}; do
            if curl -fL --silent --output /dev/null "$URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish pizzeria Reel on Instagram
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: |
          set -euo pipefail
          PROFILE=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" "https://graph.instagram.com/me?fields=id,username")
          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          test -n "$IG_USER_ID"

          CAPTION="La tua pizzeria merita un sito che faccia venire fame al primo sguardo. Realizziamo siti web su misura per pizzerie, ristoranti e attivita locali. Vuoi vedere una demo gratuita? Scrivici in DM. #KaironLabsStudio #Pizzeria #SitiWeb #WebDesign"

          CREATE=$(curl --fail-with-body --silent --show-error \
            -X POST "https://graph.instagram.com/$IG_USER_ID/media" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "share_to_feed=true")

          CREATION_ID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CREATION_ID"

          READY=false
          for i in {1..30}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
              "https://graph.instagram.com/$CREATION_ID?fields=status_code")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status_code // empty')
            echo "Instagram status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then READY=true; break; fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "$STATUS_JSON"
              exit 1
            fi
            sleep 10
          done

          test "$READY" = "true"
          PUBLISH=$(curl --fail-with-body --silent --show-error \
            -X POST "https://graph.instagram.com/$IG_USER_ID/media_publish" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CREATION_ID")
          MEDIA_ID=$(echo "$PUBLISH" | jq -r '.id // empty')
          test -n "$MEDIA_ID"
          echo "PIZZERIA REEL PUBLISHED: $MEDIA_ID"
