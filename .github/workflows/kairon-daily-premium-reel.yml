name: Kairon Native 9x16 Reel Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kairon-native-9x16-reel-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify native 9x16 test asset
        shell: bash
        run: |
          set -euo pipefail
          FILE='approved/kairon-test-reel-1080x1920.jpg'
          test -s "$FILE"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$FILE")
          echo "Native asset dimensions: $DIM"
          test "$DIM" = '1080x1920'

      - name: Build deep Kairon cinematic audio
        shell: bash
        run: |
          python - <<'PY'
          import wave, math, struct
          sr=48000
          dur=9.0
          n=int(sr*dur)
          frames=[]

          def smoothstep(x):
              x=max(0.0,min(1.0,x))
              return x*x*(3.0-2.0*x)

          with wave.open('/tmp/kairon.wav','wb') as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(sr)
              for i in range(n):
                  t=i/sr
                  master=max(0.0,min(1.0,(9.0-t)/0.75))
                  bed=(math.sin(2*math.pi*36.7*t)*0.20 +
                       math.sin(2*math.pi*55.0*t)*0.105 +
                       math.sin(2*math.pi*73.4*t)*0.052)
                  bed*=min(1.0,t/1.0)*master
                  b_env=smoothstep((t-1.0)/3.2) * max(0.0,min(1.0,(6.2-t)/0.9))
                  brass=(math.sin(2*math.pi*98.0*t)*0.060 +
                         math.sin(2*math.pi*130.81*t)*0.043 +
                         math.sin(2*math.pi*196.0*t)*0.018)*b_env
                  drums=0.0
                  for st,g,f in [(1.65,.13,54),(2.45,.16,50),(3.15,.20,46),(3.72,.25,43),(4.18,.34,40)]:
                      x=t-st
                      if 0.0<=x<1.0:
                          drums += g*math.sin(2*math.pi*(f+10*math.exp(-7*x))*x)*math.exp(-5.0*x)
                  impact=0.0
                  x=t-4.42
                  if 0.0<=x<1.7:
                      sub=(math.sin(2*math.pi*(34+18*math.exp(-2*x))*x)*0.58 +
                           math.sin(2*math.pi*48*x)*0.25)*math.exp(-2.5*x)
                      low=(math.sin(2*math.pi*98*x)*0.14 +
                           math.sin(2*math.pi*130.81*x)*0.085 +
                           math.sin(2*math.pi*196*x)*0.042)*math.exp(-2.2*x)
                      impact=sub+low
                  tail=0.0
                  x=t-4.55
                  if 0.0<=x<3.4:
                      tail=(math.sin(2*math.pi*110.0*x)*0.060 +
                            math.sin(2*math.pi*164.81*x)*0.034 +
                            math.sin(2*math.pi*220.0*x)*0.014)*math.exp(-0.85*x)
                  accent=0.0
                  x=t-6.65
                  if 0.0<=x<1.2:
                      accent=(math.sin(2*math.pi*73.4*x)*0.17 +
                              math.sin(2*math.pi*110*x)*0.075)*math.exp(-4.0*x)
                  s=(bed+brass+drums+impact+tail+accent)*master
                  s=max(-0.92,min(0.92,s))
                  v=int(s*32767)
                  frames.append(struct.pack('<hh',v,v))
              w.writeframes(b''.join(frames))
          PY

      - name: Render native Reel without crop or resize
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='approved/kairon-test-reel-1080x1920.jpg'
          ffmpeg -y -loop 1 -framerate 25 -i "$IMAGE" -i /tmp/kairon.wav \
            -filter_complex "[0:v]fade=t=out:st=8.4:d=0.6,format=yuv420p[v];[1:a]lowpass=f=850,volume=1.0[a]" \
            -map '[v]' -map '[a]' -t 9 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart /tmp/kairon-reel-test.mp4
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/kairon-reel-test.mp4)
          echo "Rendered Reel dimensions: $DIM"
          test "$DIM" = '1080x1920'

      - name: Publish MP4 to GitHub for Instagram fetch
        id: video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          cp /tmp/kairon-reel-test.mp4 generated/reel-test-current.mp4
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add generated/reel-test-current.mp4
          git commit -m 'Render native 9x16 Kairon Reel test' || true
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/reel-test-current.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in {1..25}; do
            HTTP=$(curl -L -sS -o /tmp/check.mp4 -w '%{http_code}' "$URL" || true)
            if [ "$HTTP" = '200' ] && [ -s /tmp/check.mp4 ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Publish native Reel test to Instagram
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
          CAPTION: 'TEST TECNICO Kairon — Reel nativo 9:16 1080×1920. Verifica formato senza crop o ridimensionamento. #KaironLabsStudio #ReelTest #WebDesign #SocialAutomation'
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode 'media_type=REELS' \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode 'share_to_feed=true')
          echo "CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          READY=false
          for i in {1..30}; do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "STATUS_$i=$STATUS"
            if [ "$CODE" = 'FINISHED' ]; then READY=true; break; fi
            if [ "$CODE" = 'ERROR' ] || [ "$CODE" = 'EXPIRED' ]; then exit 1; fi
            sleep 10
          done
          test "$READY" = true

          PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "creation_id=$CID")
          echo "PUBLISH=$PUB"
          MID=$(echo "$PUB" | jq -r '.id // empty')
          test -n "$MID"
