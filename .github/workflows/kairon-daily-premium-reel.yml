name: Kairon Daily Premium Reel

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish premium Reel now'
        required: false
        default: 'false'
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: kairon-daily-premium-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate at 19 Europe/Rome
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          SHOULD=false
          if [ "$EVENT_NAME" = "schedule" ]; then
            HOUR=$(TZ=Europe/Rome date +%H)
            [ "$HOUR" = "19" ] && SHOULD=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_PUBLISH" = "true" ]; then
            SHOULD=true
          fi
          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Rome time: $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Skip if a premium Reel was already published today
        id: daily
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Europe/Rome date +%F)
          LAST=''
          [ -f state/premium_reel_last_date.txt ] && LAST=$(tr -d '\r\n ' < state/premium_reel_last_date.txt)
          if [ "$TODAY" = "$LAST" ]; then
            echo 'already_posted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_posted=false' >> "$GITHUB_OUTPUT"
          fi
          echo "TODAY=$TODAY LAST=$LAST"

      - name: Choose next approved premium graphic
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          IDX=$(tr -d '\r\n ' < state/premium_reel_index.txt)
          case "$IDX" in
            0) FILE='approved/gioielleria-post.jpg'; TITLE='GIOIELLERIA'; CAPTION='Sito web per gioielleria ✨ Eleganza, prestigio e presenza digitale su misura. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Gioielleria #SitoWeb #WebDesign' ;;
            1) FILE='approved/parrucchiere-post.jpg'; TITLE='PARRUCCHIERE'; CAPTION='Sito web per parrucchiere ✂️ Un’immagine premium, prenotazioni e contatto diretto. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Parrucchiere #SitoWeb #WebDesign' ;;
            2) FILE='today/kairon-pizzeria.jpg'; TITLE='PIZZERIA'; CAPTION='Sito web per pizzeria 🍕 Menu, prenotazioni e contatti in una presenza digitale che fa venire fame. Richiedi una demo a Kairon Labs Studio. #KaironLabsStudio #Pizzeria #SitoWeb #WebDesign' ;;
            *) echo "Invalid premium reel index: $IDX"; exit 1 ;;
          esac
          test -f "$FILE"
          echo "index=$IDX" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          {
            echo 'caption<<EOF'
            echo "$CAPTION"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ensure ffmpeg is installed
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe

      - name: Build deep epic Kairon cinematic audio
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import wave, math, struct
          sr=48000
          dur=9.0
          n=int(sr*dur)
          frames=[]

          def smoothstep(x):
              x=max(0.0,min(1.0,x))
              return x*x*(3.0-2.0*x)

          with wave.open('/tmp/kairon.wav','wb') as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(sr)
              for i in range(n):
                  t=i/sr
                  master=max(0.0,min(1.0,(9.0-t)/0.75))

                  bed=(
                      math.sin(2*math.pi*36.7*t)*0.20 +
                      math.sin(2*math.pi*55.0*t)*0.105 +
                      math.sin(2*math.pi*73.4*t)*0.052
                  )
                  bed*=min(1.0,t/1.0)*master

                  b_env=smoothstep((t-1.0)/3.2) * max(0.0,min(1.0,(6.2-t)/0.9))
                  brass=(
                      math.sin(2*math.pi*98.0*t)*0.060 +
                      math.sin(2*math.pi*130.81*t)*0.043 +
                      math.sin(2*math.pi*196.0*t)*0.018
                  )*b_env

                  drums=0.0
                  for st,g,f in [(1.65,.13,54),(2.45,.16,50),(3.15,.20,46),(3.72,.25,43),(4.18,.34,40)]:
                      x=t-st
                      if 0.0<=x<1.0:
                          drums += g*math.sin(2*math.pi*(f+10*math.exp(-7*x))*x)*math.exp(-5.0*x)

                  impact=0.0
                  x=t-4.42
                  if 0.0<=x<1.7:
                      sub=(math.sin(2*math.pi*(34+18*math.exp(-2*x))*x)*0.58 +
                           math.sin(2*math.pi*48*x)*0.25)*math.exp(-2.5*x)
                      low_stab=(math.sin(2*math.pi*98*x)*0.14 +
                                math.sin(2*math.pi*130.81*x)*0.085 +
                                math.sin(2*math.pi*196*x)*0.042)*math.exp(-2.2*x)
                      impact=sub+low_stab

                  tail=0.0
                  x=t-4.55
                  if 0.0<=x<3.4:
                      tail=(math.sin(2*math.pi*110.0*x)*0.060 +
                            math.sin(2*math.pi*164.81*x)*0.034 +
                            math.sin(2*math.pi*220.0*x)*0.014)*math.exp(-0.85*x)

                  accent=0.0
                  x=t-6.65
                  if 0.0<=x<1.2:
                      accent=(math.sin(2*math.pi*73.4*x)*0.17 +
                              math.sin(2*math.pi*110*x)*0.075)*math.exp(-4.0*x)

                  s=(bed+brass+drums+impact+tail+accent)*master
                  s=max(-0.92,min(0.92,s))
                  v=int(s*32767)
                  frames.append(struct.pack('<hh',v,v))
              w.writeframes(b''.join(frames))
          PY

      - name: Render premium Reel
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          ffmpeg -y -loop 1 -i "$IMAGE" -i /tmp/kairon.wav \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.00025,1.035)':d=225:s=1080x1920:fps=25,fade=t=out:st=8.4:d=0.6[v];[1:a]lowpass=f=850,volume=1.0[a]" \
            -map '[v]' -map '[a]' -t 9 -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart /tmp/kairon-premium-reel.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/kairon-premium-reel.mp4

      - name: Publish MP4 to GitHub for Instagram fetch
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        id: video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          cp /tmp/kairon-premium-reel.mp4 generated/premium-reel-current.mp4
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add generated/premium-reel-current.mp4
          git commit -m "Render premium Kairon Reel ${{ steps.pick.outputs.title }}" || true
          git push
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/premium-reel-current.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in {1..25}; do
            HTTP=$(curl -L -sS -o /tmp/check.mp4 -w '%{http_code}' "$URL" || true)
            if [ "$HTTP" = "200" ] && [ -s /tmp/check.mp4 ]; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Publish Reel to Instagram
        id: publish
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
          CAPTION: ${{ steps.pick.outputs.caption }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'

          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode 'media_type=REELS' \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode 'share_to_feed=true')
          echo "CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"

          READY=false
          for i in {1..30}; do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "STATUS_$i=$STATUS"
            if [ "$CODE" = 'FINISHED' ]; then READY=true; break; fi
            if [ "$CODE" = 'ERROR' ] || [ "$CODE" = 'EXPIRED' ]; then exit 1; fi
            sleep 10
          done
          [ "$READY" = true ]

          PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode "creation_id=$CID")
          echo "PUBLISH=$PUB"
          MID=$(echo "$PUB" | jq -r '.id // empty')
          test -n "$MID"
          echo "media_id=$MID" >> "$GITHUB_OUTPUT"

      - name: Advance premium Reel queue after success
        if: steps.gate.outputs.should_publish == 'true' && steps.daily.outputs.already_posted != 'true' && success()
        shell: bash
        env:
          IDX: ${{ steps.pick.outputs.index }}
          TITLE: ${{ steps.pick.outputs.title }}
          MEDIA_ID: ${{ steps.publish.outputs.media_id }}
        run: |
          set -euo pipefail
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git pull --rebase
          NEXT=$(( (IDX + 1) % 3 ))
          printf '%s\n' "$NEXT" > state/premium_reel_index.txt
          TZ=Europe/Rome date +%F > state/premium_reel_last_date.txt
          printf '%s\n' "$MEDIA_ID" > state/premium_reel_last_media_id.txt
          git add state/premium_reel_index.txt state/premium_reel_last_date.txt state/premium_reel_last_media_id.txt
          git commit -m "Advance Kairon premium Reel queue after ${TITLE}" || exit 0
          git push
