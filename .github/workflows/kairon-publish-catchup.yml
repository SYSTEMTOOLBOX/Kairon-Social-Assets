name: Kairon Publish Catch-up

on:
  push:
    paths:
      - '.github/workflows/kairon-publish-catchup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start Kairon post and reel workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1"
            local code
            code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
              -X POST "https://api.github.com/repos/$REPO/actions/workflows/$workflow/dispatches" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d '{"ref":"main"}')
            echo "$workflow dispatch HTTP=$code"
            test "$code" = '204'
          }
          dispatch 'kairon-daily-premium-post.yml'
          dispatch 'kairon-daily-premium-reel.yml'
