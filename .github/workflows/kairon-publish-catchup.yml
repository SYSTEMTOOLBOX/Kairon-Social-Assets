name: Kairon Publish Catch-up

on:
  push:
    paths:
      - '.github/workflows/kairon-publish-catchup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Recover missing Kairon post and Reel safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Catch-up recovery: 2026-08-27 21:11 Europe/Rome POST + REEL'
          for WF in kairon-daily-premium-post.yml kairon-daily-premium-reel.yml; do
            code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
              -X POST "https://api.github.com/repos/$REPO/actions/workflows/$WF/dispatches" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d '{"ref":"main"}')
            echo "$WF dispatch HTTP=$code"
            test "$code" = '204'
          done
