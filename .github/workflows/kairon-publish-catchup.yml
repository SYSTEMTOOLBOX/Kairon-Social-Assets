name: Kairon Publish Catch-up

on:
  push:
    paths:
      - '.github/workflows/kairon-publish-catchup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start Kairon reel workflow retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Catch-up retry: 2026-08-25 PALESTRA'
          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$REPO/actions/workflows/kairon-daily-premium-reel.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"ref":"main"}')
          echo "reel dispatch HTTP=$code"
          test "$code" = '204'
