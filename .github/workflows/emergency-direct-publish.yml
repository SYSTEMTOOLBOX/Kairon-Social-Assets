name: Kairon Emergency Direct Publish

on:
  push:
    paths:
      - '.github/workflows/emergency-direct-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publish ready Reel directly
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          PROFILE=$(curl --silent --show-error -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" "https://graph.instagram.com/me?fields=id,username")
          echo "$PROFILE"
          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          test -n "$IG_USER_ID"

          VIDEO_URL="https://raw.githubusercontent.com/SYSTEMTOOLBOX/Kairon-Social-Assets/main/generated/reel-preview.mp4"
          CAPTION="Non il solito sito. Kairon Labs Studio trasforma idee in progetti digitali su misura. Demo gratuita: scrivici in DM. #KaironLabsStudio #WebDesign #SitiWeb"

          CREATE=$(curl --silent --show-error -X POST "https://graph.instagram.com/$IG_USER_ID/media" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "share_to_feed=true")
          echo "CREATE: $CREATE"
          CREATION_ID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CREATION_ID"

          READY=false
          for i in {1..30}; do
            STATUS_JSON=$(curl --silent --show-error -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" "https://graph.instagram.com/$CREATION_ID?fields=status_code")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status_code // empty')
            echo "STATUS: $STATUS_JSON"
            if [ "$STATUS" = "FINISHED" ]; then READY=true; break; fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then exit 1; fi
            sleep 8
          done
          test "$READY" = "true"

          PUBLISH=$(curl --silent --show-error -X POST "https://graph.instagram.com/$IG_USER_ID/media_publish" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CREATION_ID")
          echo "PUBLISH: $PUBLISH"
          MEDIA_ID=$(echo "$PUBLISH" | jq -r '.id // empty')
          test -n "$MEDIA_ID"
