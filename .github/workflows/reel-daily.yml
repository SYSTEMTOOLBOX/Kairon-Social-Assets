name: Kairon Daily Reel

on:
  push:
    paths:
      - 'scripts/kairon_monthly.py'
      - '.github/workflows/reel-daily.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Pubblica davvero su Instagram'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: kairon-daily-reel
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.clock.outputs.should_run }}
      should_publish: ${{ steps.clock.outputs.should_publish }}
    steps:
      - name: Decide test o pubblicazione
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'

          if [ "$EVENT" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Test automatico: nessuna pubblicazione Instagram."
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            if [ '${{ inputs.publish }}' = 'true' ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          ITALY_HOUR=$(TZ=Europe/Rome date +%H)
          ITALY_TIME=$(TZ=Europe/Rome date '+%Y-%m-%d %H:%M %Z')
          echo "Ora italiana: $ITALY_TIME"
          if [ "$ITALY_HOUR" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  reel:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara motore grafico e audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-font-awesome >/dev/null
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          python -m pip install --disable-pip-version-check -q pillow numpy
          ffmpeg -version | head -1

      - name: Scegli settore e genera visual
        id: content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated state
          INDEX=0
          if [ -f state/niche_index.txt ]; then
            RAW=$(tr -dc '0-9' < state/niche_index.txt)
            if [ -n "$RAW" ]; then INDEX=$RAW; fi
          fi
          INDEX=$((INDEX % 29))
          echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          python scripts/kairon_monthly.py --index "$INDEX" --outdir generated
          TITLE=$(python -c "import json; print(json.load(open('generated/meta.json', encoding='utf-8'))['title'])")
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Settore del giorno: $TITLE (indice $INDEX)"

      - name: Crea Reel cinematografico con firma sonora Kairon
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error \
            -loop 1 -i generated/kairon-daily.jpg \
            -i generated/kairon-cinematic-ident.wav \
            -t 9 \
            -vf "scale=1080:1920,zoompan=z='min(zoom+0.00022,1.035)':d=225:s=1080x1920:fps=25,fade=t=in:st=0:d=0.25,fade=t=out:st=8.4:d=0.6" \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -filter:a "volume=0.72" \
            -shortest -movflags +faststart \
            generated/reel-current.mp4
          test -s generated/reel-current.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 generated/reel-current.mp4

      - name: Salva anteprima del test
        if: needs.gate.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kairon-monthly-preview
          path: |
            generated/kairon-daily.jpg
            generated/reel-current.mp4
            generated/meta.json
          retention-days: 3

      - name: Pubblica MP4 nel repository
        if: needs.gate.outputs.should_publish == 'true'
        id: video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"
          git add generated/kairon-daily.jpg generated/reel-current.mp4 generated/meta.json
          git commit -m "Prepare Kairon niche Reel ${{ steps.content.outputs.title }}" || true
          git push
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/reel-current.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Attendi video pubblico
        if: needs.gate.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.video.outputs.url }}'
          for i in {1..24}; do
            if curl -fL --silent --output /dev/null "$URL"; then
              echo "Video pubblico pronto."
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Pubblica Reel Instagram
        if: needs.gate.outputs.should_publish == 'true'
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: |
          set -euo pipefail
          CAPTION=$(python -c "import json; print(json.load(open('generated/meta.json', encoding='utf-8'))['caption'])")
          PROFILE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            "https://graph.instagram.com/me?fields=id,username")
          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          USERNAME=$(echo "$PROFILE" | jq -r '.username // empty')
          test -n "$IG_USER_ID"
          echo "Pubblicazione per @$USERNAME"

          CREATE=$(curl --fail-with-body --silent --show-error \
            -X POST "https://graph.instagram.com/$IG_USER_ID/media" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "share_to_feed=true")
          CREATION_ID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CREATION_ID"

          READY=false
          for i in {1..30}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
              "https://graph.instagram.com/$CREATION_ID?fields=status_code")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status_code // empty')
            echo "Instagram status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then READY=true; break; fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "$STATUS_JSON"
              exit 1
            fi
            sleep 10
          done
          test "$READY" = "true"

          PUBLISH=$(curl --fail-with-body --silent --show-error \
            -X POST "https://graph.instagram.com/$IG_USER_ID/media_publish" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CREATION_ID")
          MEDIA_ID=$(echo "$PUBLISH" | jq -r '.id // empty')
          test -n "$MEDIA_ID"
          echo "KAIRON REEL PUBBLICATO: $MEDIA_ID"

      - name: Avanza al settore successivo solo dopo successo
        if: needs.gate.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=${{ steps.content.outputs.index }}
          NEXT=$(( (CURRENT + 1) % 29 ))
          printf '%s\n' "$NEXT" > state/niche_index.txt
          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"
          git add state/niche_index.txt
          git commit -m "Advance Kairon niche queue to $NEXT" || true
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
            sleep 3
          done
          exit 1
