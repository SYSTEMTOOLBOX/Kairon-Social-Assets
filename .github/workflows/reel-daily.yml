name: Kairon Daily Reel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reel-daily.yml'
  schedule:
    - cron: '0 19 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: kairon-daily-reel
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepara strumenti
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Scegli prossimo JPEG valido
        id: choose
        shell: bash
        run: |
          set -euo pipefail

          ZIP1="Kairon_Batch_01_JPEG.zip"
          ZIP3="Kairon_Batch_03_JPEG_1786173983.zip"

          mkdir -p extracted state generated
          rm -rf extracted/*

          VALID_ZIPS=()
          for f in "$ZIP1" "$ZIP3"; do
            if [ ! -f "$f" ]; then
              echo "File non trovato, salto: $f"
              continue
            fi

            if unzip -tq "$f" >/dev/null 2>&1; then
              DEST="extracted/${f%.zip}"
              mkdir -p "$DEST"
              unzip -oq "$f" -d "$DEST"
              VALID_ZIPS+=("$f")
              echo "ZIP valido: $f"
            else
              echo "ZIP non valido, salto: $f"
            fi
          done

          if [ "${#VALID_ZIPS[@]}" -eq 0 ]; then
            echo "Nessun pacchetto JPEG valido disponibile."
            exit 1
          fi

          mapfile -t IMAGES < <(find extracted -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | sort)
          COUNT=${#IMAGES[@]}

          if [ "$COUNT" -lt 1 ]; then
            echo "Nessun JPEG trovato."
            exit 1
          fi

          echo "JPEG disponibili: $COUNT"
          PACK_HASH=$(sha256sum "${VALID_ZIPS[@]}" | sha256sum | awk '{print $1}')

          OLD_HASH=""
          if [ -f state/pack_hash.txt ]; then
            OLD_HASH=$(cat state/pack_hash.txt)
          fi

          if [ "$PACK_HASH" != "$OLD_HASH" ]; then
            NEXT=1
            echo "Pacchetto cambiato: parto dalla foto 1."
          elif [ -f state/next_reel.txt ]; then
            NEXT=$(cat state/next_reel.txt)
          else
            NEXT=1
          fi

          if ! [[ "$NEXT" =~ ^[0-9]+$ ]] || [ "$NEXT" -lt 1 ] || [ "$NEXT" -gt "$COUNT" ]; then
            NEXT=1
          fi

          INDEX=$((NEXT - 1))
          IMAGE="${IMAGES[$INDEX]}"

          echo "Foto scelta: $IMAGE"
          echo "Numero Reel: $NEXT di $COUNT"

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "pack_hash=$PACK_HASH" >> "$GITHUB_OUTPUT"

      - name: Crea Reel verticale
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.choose.outputs.image }}"

          ffmpeg -y \
            -loop 1 \
            -i "$IMAGE" \
            -f lavfi \
            -i anullsrc=r=48000:cl=stereo \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=30:20,eq=brightness=-0.20[background];[fg]scale=1000:1760:force_original_aspect_ratio=decrease[foreground];[background][foreground]overlay=(W-w)/2:(H-h)/2,format=yuv420p[video]" \
            -map "[video]" \
            -map 1:a \
            -t 8 \
            -r 30 \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            generated/reel-current.mp4

      - name: Pubblica MP4 nel repository
        id: video
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"

          git add generated/reel-current.mp4
          git commit -m "Prepare Kairon Reel ${{ steps.choose.outputs.next }}" || true
          git push

          VIDEO_COMMIT=$(git rev-parse HEAD)
          VIDEO_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VIDEO_COMMIT}/generated/reel-current.mp4"
          echo "url=$VIDEO_URL" >> "$GITHUB_OUTPUT"

      - name: Attendi disponibilita video
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_URL="${{ steps.video.outputs.url }}"

          for i in {1..18}; do
            if curl -fL --silent --output /dev/null "$VIDEO_URL"; then
              echo "Video disponibile."
              exit 0
            fi
            echo "Attendo GitHub... tentativo $i"
            sleep 10
          done

          echo "Video non disponibile in tempo."
          exit 1

      - name: Pubblica Reel Instagram
        shell: bash
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
          REEL_NUMBER: ${{ steps.choose.outputs.next }}
        run: |
          set -euo pipefail

          CAPTIONS=(
            "Siti web su misura per trasformare idee in progetti digitali. Scrivici in DM per una demo gratuita. #KaironLabsStudio #SitiWeb #WebDesign"
            "Web app intelligenti per semplificare lavoro, vendite e gestione. Demo gratuita in DM. #KaironLabsStudio #WebApp #Digital"
            "App moderne, intuitive e progettate su misura. Scrivici per una demo gratuita. #KaironLabsStudio #AppDevelopment"
            "Automazioni digitali per risparmiare tempo e lavorare meglio. #KaironLabsStudio #Automazione #Digital"
            "Brand digitali forti, riconoscibili e coerenti. #KaironLabsStudio #Branding #DigitalDesign"
            "Dashboard professionali per trasformare i dati in decisioni. #KaironLabsStudio #Dashboard #WebApp"
            "E-commerce pensati per vendere e crescere online. #KaironLabsStudio #Ecommerce #WebDesign"
            "Soluzioni digitali costruite sulle esigenze reali del progetto. #KaironLabsStudio #Software #Digital"
            "Sviluppo videogiochi con Godot: concept, prototipi e mondi interattivi. #KaironLabsStudio #Godot #GameDev"
            "Supporto e crescita digitale: il progetto continua anche dopo il lancio. #KaironLabsStudio #DigitalGrowth"
            "Siti web professionali, veloci e pensati per convertire. Demo gratuita in DM. #KaironLabsStudio #SitiWeb"
            "E-commerce e prenotazioni online costruiti su misura per la tua attività. #KaironLabsStudio #Ecommerce"
            "Gestionali, CRM e strumenti interni per lavorare in modo più semplice. #KaironLabsStudio #WebApp #CRM"
            "App mobile premium: design moderno, prestazioni e semplicità. #KaironLabsStudio #MobileApp"
            "Automazioni e integrazioni per collegare strumenti e processi. #KaironLabsStudio #Automation #API"
            "Una presenza digitale forte parte da un brand coerente. #KaironLabsStudio #Branding #Design"
            "Piattaforme web intelligenti per aziende e professionisti. #KaironLabsStudio #WebDevelopment"
            "Strategia, supporto e tecnologia per far crescere il tuo progetto. #KaironLabsStudio #DigitalGrowth"
            "Dal concept al prototipo: videogiochi e idee interattive con Godot. #KaironLabsStudio #Godot #GameDev"
            "Dall'idea al prodotto digitale: progetti su misura e demo gratuita. Scrivici in DM. #KaironLabsStudio #DigitalStudio"
          )

          IDX=$(( (REEL_NUMBER - 1) % ${#CAPTIONS[@]} ))
          CAPTION="${CAPTIONS[$IDX]}"

          PROFILE=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            "https://graph.instagram.com/me?fields=id,username")

          IG_USER_ID=$(echo "$PROFILE" | jq -r '.id // empty')
          USERNAME=$(echo "$PROFILE" | jq -r '.username // empty')

          if [ -z "$IG_USER_ID" ]; then
            echo "Impossibile recuperare account Instagram."
            echo "$PROFILE"
            exit 1
          fi

          echo "Account: @$USERNAME"

          CREATE=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://graph.instagram.com/$IG_USER_ID/media" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "share_to_feed=true")

          CREATION_ID=$(echo "$CREATE" | jq -r '.id // empty')
          if [ -z "$CREATION_ID" ]; then
            echo "$CREATE"
            exit 1
          fi

          READY=false
          for i in {1..24}; do
            STATUS_JSON=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
              "https://graph.instagram.com/$CREATION_ID?fields=status_code")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.status_code // empty')
            echo "Stato Instagram: $STATUS"

            if [ "$STATUS" = "FINISHED" ]; then
              READY=true
              break
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "$STATUS_JSON"
              exit 1
            fi
            sleep 15
          done

          if [ "$READY" != "true" ]; then
            echo "Instagram non ha terminato l'elaborazione in tempo."
            exit 1
          fi

          PUBLISH=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://graph.instagram.com/$IG_USER_ID/media_publish" \
            -H "Authorization: Bearer $INSTAGRAM_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CREATION_ID")

          MEDIA_ID=$(echo "$PUBLISH" | jq -r '.id // empty')
          if [ -z "$MEDIA_ID" ]; then
            echo "$PUBLISH"
            exit 1
          fi

          echo "REEL $REEL_NUMBER PUBBLICATO! Media ID: $MEDIA_ID"

      - name: Salva avanzamento
        shell: bash
        run: |
          set -euo pipefail

          CURRENT=${{ steps.choose.outputs.next }}
          COUNT=${{ steps.choose.outputs.count }}
          NEXT=$((CURRENT + 1))
          if [ "$NEXT" -gt "$COUNT" ]; then
            NEXT=1
          fi

          mkdir -p state
          echo "$NEXT" > state/next_reel.txt
          echo "${{ steps.choose.outputs.pack_hash }}" > state/pack_hash.txt

          git config user.name "Kairon Auto Social"
          git config user.email "kaironlabsstudio@gmail.com"
          git add state/next_reel.txt state/pack_hash.txt
          git commit -m "Advance Kairon Reel queue to $NEXT" || true

          for i in 1 2 3; do
            if git push; then
              echo "Stato salvato. Prossimo Reel: $NEXT"
              exit 0
            fi
            git pull --rebase
            sleep 5
          done

          echo "Reel pubblicato ma stato non salvato."
          exit 1
