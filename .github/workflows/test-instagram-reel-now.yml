name: Test Instagram Reel Now

on:
  push:
    paths:
      - '.github/workflows/test-instagram-reel-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild approved Kairon music
        shell: bash
        run: |
          set -euo pipefail
          base64 -d approved_audio/kairon_intro_approved_16k.mp3.b64 > /tmp/kairon-intro.mp3
          BYTES=$(wc -c < /tmp/kairon-intro.mp3 | tr -d ' ')
          SHA=$(sha256sum /tmp/kairon-intro.mp3 | awk '{print $1}')
          echo "Approved music bytes=$BYTES sha256=$SHA"
          test "$BYTES" = "9892"
          test "$SHA" = "ccbd827645177513574fcdcf70ecae01b5952e6a3f555c36d7eb0455690b7ece"

      - name: Build temporary test Reel with approved music
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core; }
          mkdir -p generated
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=1080x1920:d=5:r=24 \
            -i /tmp/kairon-intro.mp3 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='KAIRON LABS STUDIO':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=(h-text_h)/2-80,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='TEST REEL + MUSICA APPROVATA':fontcolor=white:fontsize=40:x=(w-text_w)/2:y=(h-text_h)/2+40" \
            -t 5 -shortest -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 128k -movflags +faststart generated/instagram-test-reel-music.mp4
          test -s generated/instagram-test-reel-music.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name -of compact generated/instagram-test-reel-music.mp4

      - name: Publish test video file to GitHub
        id: video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add generated/instagram-test-reel-music.mp4
          git commit -m 'Temporary Instagram Reel music test asset' || true
          git push
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/instagram-test-reel-music.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in {1..20}; do
            HTTP=$(curl -L -sS -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "Video check $i HTTP=$HTTP"
            [ "$HTTP" = "200" ] && exit 0
            sleep 3
          done
          exit 1

      - name: Publish temporary Reel with music to Instagram
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          echo "Profile: $ME"
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          echo "Testing Reel+music publication for @$USERNAME"

          CREATE_CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST "https://graph.instagram.com/$IG/media" \
            -H "Authorization: Bearer $TOKEN" \
            --data-urlencode 'media_type=REELS' \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode 'caption=TEST TECNICO REEL + MUSICA — Kairon Labs Studio. Questo Reel verrà eliminato dopo la verifica.' \
            --data-urlencode 'share_to_feed=true' || true)
          CREATE_BODY=$(cat /tmp/create.json)
          echo "Create HTTP=$CREATE_CODE response=$CREATE_BODY"
          CID=$(echo "$CREATE_BODY" | jq -r '.id // empty' 2>/dev/null || true)
          test -n "$CID"

          READY=0
          for i in {1..40}; do
            S=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$S" | jq -r '.status_code // empty')
            echo "Container status $i: $S"
            [ "$CODE" = 'FINISHED' ] && { READY=1; break; }
            [ "$CODE" = 'ERROR' ] && exit 1
            sleep 6
          done
          [ "$READY" = 1 ] || exit 1

          MID=""
          for attempt in 1 2 3 4 5; do
            PUB_CODE=$(curl -sS -o /tmp/publish.json -w '%{http_code}' \
              -X POST "https://graph.instagram.com/$IG/media_publish" \
              -H "Authorization: Bearer $TOKEN" \
              --data-urlencode "creation_id=$CID" || true)
            PUB_BODY=$(cat /tmp/publish.json)
            echo "Publish attempt $attempt HTTP=$PUB_CODE response=$PUB_BODY"
            MID=$(echo "$PUB_BODY" | jq -r '.id // empty' 2>/dev/null || true)
            [ -n "$MID" ] && break
            sleep $((attempt * 10))
          done
          test -n "$MID"

          VERIFY=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            "https://graph.instagram.com/$MID?fields=id,media_type,media_product_type,permalink,timestamp")
          echo "FINAL_VERIFY=$VERIFY"
          PERMALINK=$(echo "$VERIFY" | jq -r '.permalink // empty')
          test -n "$PERMALINK"
          echo "TEST_REEL_MUSIC_PUBLISHED=$MID"
          echo "TEST_REEL_MUSIC_PERMALINK=$PERMALINK"
