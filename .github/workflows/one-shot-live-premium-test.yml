name: Kairon One Shot Premium Live Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kairon-one-shot-premium-live-test
  cancel-in-progress: false

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check one-shot guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -f state/one_shot_premium_test_done.txt ] && [ "$(tr -d '\r\n ' < state/one_shot_premium_test_done.txt)" = "1" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify approved premium graphics
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f approved/parrucchiere-post.jpg
          test -f approved/gioielleria-post.jpg

      - name: Publish premium Parrucchiere POST
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'
          IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/approved/parrucchiere-post.jpg"
          HTTP=$(curl -L -sS -o /tmp/parrucchiere.jpg -w '%{http_code}' "$IMAGE_URL")
          test "$HTTP" = '200'
          test -s /tmp/parrucchiere.jpg
          CAPTION='Sito web per parrucchiere ✂️ Grafica premium Kairon Labs Studio. Prenotazioni, servizi e contatto diretto. Richiedi una demo. #KaironLabsStudio #Parrucchiere #SitoWeb #WebDesign'
          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" -H "Authorization: Bearer $TOKEN" --data-urlencode "image_url=$IMAGE_URL" --data-urlencode "caption=$CAPTION")
          echo "POST_CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"
          MID=''
          for attempt in 1 2 3 4 5; do
            PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" -H "Authorization: Bearer $TOKEN" --data-urlencode "creation_id=$CID")
            echo "POST_PUBLISH_$attempt=$PUB"
            MID=$(echo "$PUB" | jq -r '.id // empty')
            [ -n "$MID" ] && break
            sleep $((attempt*7))
          done
          test -n "$MID"
          FOUND=false
          for i in {1..20}; do
            RECENT=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$IG/media?fields=id,media_type,permalink&limit=10")
            OK=$(echo "$RECENT" | jq -r --arg MID "$MID" '[.data[]?.id == $MID] | any')
            if [ "$OK" = 'true' ]; then
              LINK=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .permalink')
              TYPE=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .media_type')
              echo "VISIBLE_POST=$LINK"
              test "$TYPE" = 'IMAGE'
              FOUND=true
              break
            fi
            sleep 5
          done
          [ "$FOUND" = true ]

      - name: Build cinematic Reel audio
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import wave, math, struct
          sr=48000; dur=9.0; n=int(sr*dur)
          with wave.open('/tmp/kairon.wav','wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr)
              frames=[]
              for i in range(n):
                  t=i/sr
                  bed=(math.sin(2*math.pi*43*t)*0.18 + math.sin(2*math.pi*64.5*t)*0.08)
                  swell=min(1.0,t/3.9)**2
                  rise=(math.sin(2*math.pi*(85+230*t*t)*t)*0.03*swell) if t<4.2 else 0
                  hit=0
                  for st,g in [(2.35,.13),(3.05,.18),(3.65,.26),(4.22,.68)]:
                      x=t-st
                      if 0<=x<1.3:
                          hit += g*math.sin(2*math.pi*(40+32*math.exp(-5*x))*x)*math.exp(-3.2*x)
                  shimmer=0
                  x=t-4.30
                  if 0<=x<3.7:
                      shimmer=(math.sin(2*math.pi*523.25*x)+0.55*math.sin(2*math.pi*783.99*x))*0.038*math.exp(-0.85*x)
                  fade=max(0.0,min(1.0,(9.0-t)/1.0))
                  s=max(-0.92,min(0.92,(bed+rise+hit+shimmer)*fade))
                  v=int(s*32767)
                  frames.append(struct.pack('<hh',v,v))
              w.writeframes(b''.join(frames))
          PY

      - name: Render premium Gioielleria REEL
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -loop 1 -i approved/gioielleria-post.jpg -i /tmp/kairon.wav \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.00025,1.035)':d=225:s=1080x1920:fps=25,fade=t=in:st=0:d=.35,fade=t=out:st=8.4:d=.6[v]" \
            -map '[v]' -map 1:a -t 9 -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart /tmp/kairon-premium-test.mp4

      - name: Publish rendered Reel file to GitHub
        if: steps.guard.outputs.run == 'true'
        id: video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          cp /tmp/kairon-premium-test.mp4 generated/one-shot-premium-test.mp4
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add generated/one-shot-premium-test.mp4
          git commit -m 'Render one-shot premium Instagram Reel test' || true
          git push
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/generated/one-shot-premium-test.mp4"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in {1..25}; do
            HTTP=$(curl -L -sS -o /tmp/check.mp4 -w '%{http_code}' "$URL" || true)
            if [ "$HTTP" = '200' ] && [ -s /tmp/check.mp4 ]; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Publish premium Gioielleria REEL
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.video.outputs.url }}
        run: |
          set -euo pipefail
          ME=$(curl -sS -H "Authorization: Bearer $TOKEN" 'https://graph.instagram.com/me?fields=id,username')
          IG=$(echo "$ME" | jq -r '.id // empty')
          USERNAME=$(echo "$ME" | jq -r '.username // empty')
          test -n "$IG"
          test "$USERNAME" = 'kaironlabsstudio'
          CAPTION='Sito web per gioielleria ✨ Reel premium Kairon Labs Studio. Eleganza, prestigio e presenza digitale su misura. Richiedi una demo. #KaironLabsStudio #Gioielleria #SitoWeb #WebDesign'
          CREATE=$(curl -sS -X POST "https://graph.instagram.com/$IG/media" -H "Authorization: Bearer $TOKEN" --data-urlencode 'media_type=REELS' --data-urlencode "video_url=$VIDEO_URL" --data-urlencode "caption=$CAPTION" --data-urlencode 'share_to_feed=true')
          echo "REEL_CREATE=$CREATE"
          CID=$(echo "$CREATE" | jq -r '.id // empty')
          test -n "$CID"
          READY=false
          for i in {1..30}; do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$CID?fields=status_code,status")
            CODE=$(echo "$STATUS" | jq -r '.status_code // empty')
            echo "REEL_STATUS_$i=$STATUS"
            if [ "$CODE" = 'FINISHED' ]; then READY=true; break; fi
            if [ "$CODE" = 'ERROR' ] || [ "$CODE" = 'EXPIRED' ]; then exit 1; fi
            sleep 10
          done
          [ "$READY" = true ]
          PUB=$(curl -sS -X POST "https://graph.instagram.com/$IG/media_publish" -H "Authorization: Bearer $TOKEN" --data-urlencode "creation_id=$CID")
          echo "REEL_PUBLISH=$PUB"
          MID=$(echo "$PUB" | jq -r '.id // empty')
          test -n "$MID"
          FOUND=false
          for i in {1..25}; do
            RECENT=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://graph.instagram.com/$IG/media?fields=id,media_type,media_product_type,permalink&limit=10")
            OK=$(echo "$RECENT" | jq -r --arg MID "$MID" '[.data[]?.id == $MID] | any')
            if [ "$OK" = 'true' ]; then
              LINK=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .permalink')
              PRODUCT=$(echo "$RECENT" | jq -r --arg MID "$MID" '.data[] | select(.id==$MID) | .media_product_type')
              echo "VISIBLE_REEL=$LINK"
              echo "MEDIA_PRODUCT_TYPE=$PRODUCT"
              FOUND=true
              break
            fi
            sleep 6
          done
          [ "$FOUND" = true ]

      - name: Mark test done and advance real queues
        if: steps.guard.outputs.run == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          mkdir -p state
          printf '1\n' > state/one_shot_premium_test_done.txt
          printf '2\n' > state/premium_post_index.txt
          printf '1\n' > state/premium_reel_index.txt
          git config user.name 'Kairon Auto Social'
          git config user.email 'kaironlabsstudio@gmail.com'
          git add state/one_shot_premium_test_done.txt state/premium_post_index.txt state/premium_reel_index.txt
          git commit -m 'Complete premium Instagram live test and advance queues' || true
          git push
